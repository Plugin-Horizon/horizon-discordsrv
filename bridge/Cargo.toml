[package]
name = "discordsrv-bridge"
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-3.0-or-later"
description = "Discord console channel bridge for a Horizon dedicated server (gateway, REST, log forwarding)"

# Only crates in Horizon's Cargo.lock, by version requirement (docs/native-mods.md).
[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
log = "0.4"
regex = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
base64 = "0.22"
toml = "1.1"
tungstenite = { version = "0.30", default-features = false }
ureq = { version = "2", default-features = false, features = ["tls"] }
webpki-roots = "0.26"
