# horizon-discordsrv: DiscordSRV for a Horizon dedicated server (console channel, chat channels,
# notifications, account linking).
[mod]
id = "discordsrv"
version = "0.3.0"
priority = 100

[compatibility]
horizon_revision = "a589a3dd9be04fa7f17667c0175711aaa92e1147"

# The gateway, REST, log forwarding and chat relay: threads of their own, outside the server thread.
[[crate]]
id = "bridge"
path = "bridge"

# A dedicated server starts: read config/discordsrv/config.toml and connect (a client turns the
# log feed off).
[[injection]]
id = "start"
hook = "server_about_to_start"
hook_version = 1
kind = "HEAD"
helper = "glue/start.rs"
bindings = [{ name = "dedicated", ty = "bool", value = "dedicated" }]

# Every message the log gets, on the log's writer thread (no Game): to the console channel's
# queue. Replaces following `logs/latest.log`. Hook native_log_line (not merged upstream yet).
[[injection]]
id = "log-line"
kind = "HEAD"
target = "horizon_client_lib::native_client_hooks::native_log_line"
helper = "glue/log_line.rs"
bindings = [
  { name = "level", ty = "&str", value = "level" },
  { name = "message", ty = "&str", value = "message" },
]

# Every tick: TPS and players to the bridge; queued commands, Discord lines and replies to the game.
[[injection]]
id = "tick"
hook = "tick"
hook_version = 1
kind = "HEAD"
helper = "glue/tick.rs"
bindings = [{ name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" }]

# The server stops: leave notifications of the players still on, last console lines, shutdown
# message and topics, disconnect.
[[injection]]
id = "stop"
hook = "server_stopping"
hook_version = 1
kind = "HEAD"
helper = "glue/stop.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "dedicated", ty = "bool", value = "dedicated" },
]

# A login accepted, before the saved state loads: first join or not.
[[injection]]
id = "login"
hook = "player_login"
hook_version = 1
kind = "HEAD"
helper = "glue/login.rs"
bindings = [{ name = "player", ty = "u128", value = "player" }]

# Join notification.
[[injection]]
id = "logged-in"
hook = "player_logged_in"
hook_version = 1
kind = "HEAD"
helper = "glue/logged_in.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "player", ty = "u128", value = "player" },
  { name = "name", ty = "&str", value = "name" },
]

# Leave notification.
[[injection]]
id = "logged-out"
hook = "player_logged_out"
hook_version = 1
kind = "HEAD"
helper = "glue/logged_out.rs"
bindings = [
  { name = "player", ty = "u128", value = "player" },
  { name = "name", ty = "&str", value = "name" },
]

# Death notification.
[[injection]]
id = "died"
hook = "player_died"
hook_version = 1
kind = "HEAD"
helper = "glue/died.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "player", ty = "u128", value = "player" },
  { name = "cause", ty = "Option<&str>", value = "cause" },
]

# Advancement notification.
[[injection]]
id = "advancement"
hook = "player_advancement_done"
hook_version = 1
kind = "HEAD"
helper = "glue/advancement.rs"
bindings = [
  { name = "player", ty = "u128", value = "player" },
  { name = "name", ty = "&str", value = "name" },
  { name = "advancement", ty = "&str", value = "advancement" },
]

# Game chat to the chat channel. A free function of the server's chat (no Game in reach).
[[injection]]
id = "chat"
hook = "player_chat"
hook_version = 1
kind = "HEAD"
helper = "glue/chat.rs"
bindings = [
  { name = "player", ty = "u128", value = "player" },
  { name = "name", ty = "&str", value = "name" },
  { name = "message", ty = "&str", value = "message" },
  { name = "cancelled", ty = "bool", value = "*cancel" },
]

# /discord, /discord link, /discord linked, /discord unlink.
[[injection]]
id = "command"
hook = "player_command"
hook_version = 1
kind = "HEAD"
helper = "glue/command.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "player", ty = "u128", value = "player" },
  { name = "name", ty = "&str", value = "name" },
  { name = "command", ty = "&str", value = "command" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
  { name = "replies", ty = "&mut Vec<horizon_client::text::Text>", value = "&mut *replies" },
]

# /discord in the players' command tree.
[[injection]]
id = "register"
hook = "register_commands"
hook_version = 1
kind = "HEAD"
helper = "glue/register.rs"
bindings = [
  { name = "commands", ty = "&mut Vec<horizon_client::mod_api::NativeCommand>", value = "&mut *commands" },
]
