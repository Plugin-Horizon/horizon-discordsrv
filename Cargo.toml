[package]
name = "mod-discordsrv"
version = "0.3.0"
edition = "2024"
publish = false

[dependencies]
# The launcher (or stage.py) points this at the Horizon source the game is built from.
horizon-mod-api = { git = "https://github.com/arismoko/horizon" }
# The unchanged logic crate (copied from horizon-discordsrv/bridge). Its registry crates are pinned
# by the mod's own Cargo.lock, which `horizon-launcher native-lock` must generate (see PORT_NOTES.md).
discordsrv-bridge = { path = "core" }
